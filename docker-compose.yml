
services:
  db:
    image: postgres:16
    container_name: hiresync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hiresync_db
      POSTGRES_USER: hiresync_user
      POSTGRES_PASSWORD: hiresync_password
    ports:
      - "5432:5432"
    volumes:
      - hiresync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiresync_user -d hiresync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hiresync_postgres_data:
